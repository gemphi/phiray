[package]
name = "phiray"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "phiray — Phiber's own GPU renderer (next to Cycles). Entry: `Ray`."

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
pollster.workspace = true
rayon.workspace = true
wgpu.workspace = true

web-time = { workspace = true }

[dev-dependencies]
# naga is the front end wgpu hands WGSL to, so `tests/wgsl.rs` can type-check
# every kernel on a machine with no adapter. Keep this version equal to the
# workspace's wgpu, or cargo links two copies of naga.
naga = { version = "29.0.4", features = ["wgsl-in"] }
